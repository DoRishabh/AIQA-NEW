<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowflake Analytics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js)"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-snowflake"></i>
                    <span>Analytics Hub</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3>Quick Actions</h3>
                    <button class="nav-btn active" data-view="dashboard">
                        <i class="fas fa-chart-line"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-btn" data-view="schema">
                        <i class="fas fa-database"></i>
                        <span>Schema Explorer</span>
                    </button>
                </div>
                
                <div class="nav-section">
                    <h3>Sample Queries</h3>
                    <div class="sample-queries">
                        <button class="sample-query-btn" data-query="Show top 10 products by total sales amount as a bar chart">
                            <i class="fas fa-box"></i>
                            <span>Top Products by Sales</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show sales distribution by product category as a pie chart">
                            <i class="fas fa-chart-pie"></i>
                            <span>Sales by Category</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show monthly sales trend for the last 12 months as a line chart">
                            <i class="fas fa-chart-area"></i>
                            <span>Monthly Sales Trend</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show top 5 customers by total purchase amount">
                            <i class="fas fa-users"></i>
                            <span>Top Customers</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show total revenue, total orders, and average order value as metrics">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>Key Metrics</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show sales by region as a doughnut chart">
                            <i class="fas fa-globe"></i>
                            <span>Sales by Region</span>
                        </button>
                        <button class="sample-query-btn" data-query="Show product inventory levels as a horizontal bar chart">
                            <i class="fas fa-warehouse"></i>
                            <span>Inventory Levels</span>
                        </button>
                        <button class="sample-query-btn" data-query="List all orders with details including customer name, product, and amount">
                            <i class="fas fa-table"></i>
                            <span>Order Details Table</span>
                        </button>
                    </div>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-circle"></i>
                    <span>Checking connection...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-title">
                    <h1>Analytics Dashboard</h1>
                    <p>Ask questions about your data in natural language</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-icon" id="clearDashboard" title="Clear Dashboard">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="btn btn-icon" id="exportDashboard" title="Export Dashboard">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </header>

            <!-- Query Section -->
            <section class="query-section">
                <div class="query-container">
                    <div class="query-input-wrapper">
                        <i class="fas fa-search"></i>
                        <input 
                            type="text" 
                            id="queryInput" 
                            placeholder="Ask a question... e.g., 'Show top 10 products by sales as a bar chart'"
                            autocomplete="off"
                        >
                        <button class="btn btn-primary" id="runQuery">
                            <i class="fas fa-play"></i>
                            <span>Run</span>
                        </button>
                    </div>
                    <div class="query-suggestions" id="querySuggestions"></div>
                </div>
            </section>

            <!-- Dashboard Grid -->
            <section class="dashboard-section" id="dashboardView">
                <div class="dashboard-grid" id="dashboardGrid">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-icon">
                            <i class="fas fa-chart-bar"></i>
                        </div>
                        <h2>Start Exploring Your Data</h2>
                        <p>Type a question in the search box above or select a sample query from the sidebar</p>
                        <div class="quick-start-queries">
                            <button class="quick-query" data-query="Show total sales amount as a metric">
                                <i class="fas fa-dollar-sign"></i>
                                Total Sales
                            </button>
                            <button class="quick-query" data-query="Show top 5 products by sales as a bar chart">
                                <i class="fas fa-chart-bar"></i>
                                Top Products
                            </button>
                            <button class="quick-query" data-query="Show sales by category as a pie chart">
                                <i class="fas fa-chart-pie"></i>
                                By Category
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Schema Explorer -->
            <section class="schema-section hidden" id="schemaView">
                <div class="schema-container">
                    <h2><i class="fas fa-database"></i> Database Schema</h2>
                    <div class="schema-grid" id="schemaGrid">
                        <!-- Schema cards will be inserted here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Analyzing your query...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
